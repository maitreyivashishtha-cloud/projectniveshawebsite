<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#e9ddcf;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
  .back{font-family:'Young Serif',Georgia,serif;font-size:18px;color:#3f4f2b;text-decoration:none}
  .back:hover,.back:focus-visible{text-decoration:underline}

  .tpl{background:#f4efe5;border-radius:100px;padding:52px;display:flex;flex-direction:column;gap:28px;width:1163px;max-width:100%;box-sizing:border-box;font-family:'Arimo',system-ui,sans-serif}
  .tpl *{box-sizing:border-box}
  .tpl-head{display:flex;justify-content:space-between;align-items:center;gap:12px;height:74px;flex-shrink:0}
  .tpl-title{display:flex;align-items:center;gap:18px;font:400 38px/normal 'Young Serif',Georgia,serif;letter-spacing:-.76px;color:#3f4f2b;white-space:nowrap}
  .tpl-title i{width:14px;height:14px;border-radius:50%;background:#3f4f2b;flex:none}
  .tpl-pill{background:#e9ddcf;border:1px solid #b89a77;border-radius:999px;padding:10px 18px;font:700 12px/normal 'Arimo',sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:#2c3a1d;white-space:nowrap}
  .tpl-body{display:flex;gap:40px;align-items:stretch;flex:1;min-height:0}
  .tpl-img{flex:0 0 581px;background:#fffdf8;border:2px solid #b89a77;border-radius:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
  .tpl-well{width:124px;height:124px;border-radius:50%;background:#ae9170;display:grid;place-items:center}
  .tpl-well img{width:66px;height:72px;object-fit:contain;display:block}
  .tpl-img b{font:700 15px/normal 'Arimo',sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:#3f4f2b}
  .tpl-img span{font:400 14px/normal 'Arimo',sans-serif;color:#746b5f}
  .tpl-img div{display:flex;flex-direction:column;gap:6px}
  .tpl-panel{flex:1;min-width:0;background:#3f4f2b;border-radius:42px;padding:38px;display:flex;flex-direction:column;gap:24px}
  .tpl-intro{display:flex;flex-direction:column;gap:10px}
  .tpl-eyebrow{font:700 12px/normal 'Arimo',sans-serif;letter-spacing:1.44px;text-transform:uppercase;color:#ae9170}
  .tpl-panel h2{margin:0;font:400 42px/1.04 'Young Serif',Georgia,serif;letter-spacing:-.84px;color:#fff}
  .tpl-lead{margin:0;font:400 20px/normal 'Arimo',sans-serif;color:#f4efe5;opacity:.82}
  .tpl-row{display:flex;gap:14px}
  .tpl-field{flex:1 1 0;min-width:0;height:86px;background:#fffdf8;border:1.5px solid #b89a77;border-radius:18px;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
  .tpl-field.tall{height:176px}
  .tpl-field label{font:700 12px/normal 'Arimo',sans-serif;letter-spacing:.96px;text-transform:uppercase;color:#7b5a3e}
  .tpl-field hr{margin:0;border:0;border-top:1px solid #ddd5c8;width:100%}
  /* Overlay version: fixed 1163x762 frame, content clipped, exactly as in Figma */
  .tpl--fixed{height:762px;overflow:hidden}.tpl--fixed .tpl-panel,.tpl--fixed .tpl-body{overflow:hidden}

  @media(max-width:1000px){.tpl{padding:24px;border-radius:48px}.tpl-head{flex-wrap:wrap;height:auto}.tpl-title{font-size:26px}
    .tpl-body{flex-direction:column}.tpl-img{flex:none;min-height:280px}.tpl-panel{padding:24px}.tpl-panel h2{font-size:32px}.tpl-row{flex-direction:column}}
</style></head>
